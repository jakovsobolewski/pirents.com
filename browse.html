<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse mobility gear to rent by city and category | Pirents</title>
<meta name="description" content="Search wheelchairs, mobility scooters, e-bikes, accessible cars, strollers and rollators to rent from local owners. Filter by city, dates, weight, delivery and airport handover.">
<link rel="canonical" href="https://pirents.com/browse.html">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#F7F3EC">
<meta property="og:site_name" content="Pirents">
<meta property="og:type" content="website">
<meta property="og:title" content="Browse mobility gear to rent by city and category | Pirents">
<meta property="og:description" content="Search wheelchairs, mobility scooters, e-bikes, accessible cars, strollers and rollators to rent from local owners. Filter by city, dates, weight, delivery and airport handover.">
<meta property="og:url" content="https://pirents.com/browse.html">
<meta property="og:image" content="https://pirents.com/assets/img/hero/scooter@2x.webp">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Browse mobility gear to rent by city and category | Pirents">
<meta name="twitter:description" content="Search wheelchairs, mobility scooters, e-bikes, accessible cars, strollers and rollators to rent from local owners. Filter by city, dates, weight, delivery and airport handover.">
<meta name="twitter:image" content="https://pirents.com/assets/img/hero/scooter@2x.webp">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css?v=20260929c"><link rel="stylesheet" href="assets/css/base.css?v=20260929c"><link rel="stylesheet" href="assets/css/components.css?v=20260929c">
<style>
  .browse-top { padding: var(--space-8) 0 var(--space-6); }
  .browse-layout { display: grid; grid-template-columns: 280px 1fr; gap: var(--space-8); align-items: start; padding-bottom: var(--space-16); }
  .filters { position: sticky; top: calc(var(--header-h) + 16px); display: grid; gap: var(--space-6); }
  .filters fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
  .filters legend { font-size: var(--text-sm); font-weight: 700; margin-bottom: 8px; padding: 0; }
  .filters .check { min-height: 40px; }
  .results-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-5); flex-wrap: wrap; }
  .results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5); }
  .cat-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .cat-chips::-webkit-scrollbar { display: none; }
  .filter-toggle { display: none; }
  @media (max-width: 1099px) { .results-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 899px) {
    .browse-layout { grid-template-columns: 1fr; }
    .filters { position: fixed; inset: 0; z-index: 70; background: var(--color-surface); padding: var(--space-5) var(--gutter); overflow: auto; transform: translateY(100%); transition: transform var(--dur-slow) var(--ease-out); align-content: start; }
    .filters[data-open="true"] { transform: none; }
    .filter-toggle { display: inline-flex; }
  }
  @media (max-width: 639px) { .results-grid { grid-template-columns: 1fr; } }
  .range-row { display: flex; gap: 8px; align-items: center; }
  .range-row .input { height: 44px; }
</style>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="main">
  <div class="container browse-top">
    <form class="search-bar" id="search" method="get" role="search" aria-label="Search rentals" style="margin-bottom:var(--space-5)">
      <div class="search-seg"><label for="s-where">Where</label><input id="s-where" name="where" list="cities" placeholder="e.g. Lisbon" autocomplete="off"><datalist id="cities"></datalist></div>
      <div class="search-seg"><label for="s-from">From</label><input id="s-from" name="from" type="date"></div>
      <div class="search-seg"><label for="s-to">To</label><input id="s-to" name="to" type="date"></div>
      <div class="search-seg"><label for="s-cat">What</label><select id="s-cat" name="category"><option value="">Anything</option></select></div>
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
    <div class="cat-chips" id="cat-chips" role="group" aria-label="Category"></div>
  </div>
  <div class="container browse-layout">
    <aside class="filters card card-pad" id="filters" data-open="false" aria-label="Filters">
      <div class="row between show-mobile" style="display:none" id="filters-mobile-head"><h3>Filters</h3><button class="btn btn-ghost btn-icon" type="button" aria-label="Close filters" id="filters-close"></button></div>
      <fieldset>
        <legend>Price per day</legend>
        <div class="range-row"><div class="input-affix" style="flex:1"><span>€</span><input class="input" type="number" min="0" id="f-min" placeholder="Min" aria-label="Minimum price"></div><span class="muted">to</span><div class="input-affix" style="flex:1"><span>€</span><input class="input" type="number" min="0" id="f-max" placeholder="Max" aria-label="Maximum price"></div></div>
      </fieldset>
      <fieldset id="f-features"><legend>Features</legend></fieldset>
      <fieldset>
        <legend>Minimum rating</legend>
        <select class="select" id="f-rating" aria-label="Minimum rating"><option value="0">Any</option><option value="4.5">4.5 and up</option><option value="4.8">4.8 and up</option><option value="new">New listings only</option></select>
      </fieldset>
      <button class="btn btn-outline" type="button" id="f-reset">Clear filters</button>
      <button class="btn btn-primary btn-lg show-mobile" type="button" id="filters-apply" style="display:none">Show results</button>
    </aside>
    <section aria-live="polite">
      <div class="results-head">
        <div><h1 id="results-title" style="font-size:var(--text-h3)">All listings</h1><p class="muted text-sm" id="results-sub"></p></div>
        <div class="row"><button class="btn btn-outline filter-toggle" type="button" id="filters-open">Filters</button><label class="sr-only" for="sort">Sort by</label><select class="select" id="sort" style="width:auto;height:44px"><option value="rec">Recommended</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="rating">Highest rated</option></select></div>
      </div>
      <div class="results-grid" id="results"></div>
      <div id="empty" hidden></div>
    </section>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="assets/js/data.js?v=20260929c"></script>
<script src="assets/js/app.js?v=20260929c"></script>
<script>
(function(){
  const P = window.Pirents, q = P.qs();
  const $ = (s) => document.querySelector(s);
  document.getElementById("cities").innerHTML = window.PIRENTS_CITIES.map(c => `<option value="${c}">`).join("");
  $("#s-cat").insertAdjacentHTML("beforeend", window.PIRENTS_CATEGORIES.map(c => `<option value="${c.id}">${c.name}</option>`).join(""));
  $("#s-where").value = q.where || ""; $("#s-from").value = q.from || ""; $("#s-to").value = q.to || ""; $("#s-cat").value = q.category || "";
  $("#s-from").min = P.today(); $("#s-to").min = P.today(1);
  $("#filters-close").innerHTML = P.icon("x", "icon-lg");
  $("#filters-open").insertAdjacentHTML("afterbegin", P.icon("menu"));
  $("#f-features").insertAdjacentHTML("beforeend", Object.entries(window.PIRENTS_FEATURES).map(([k, v]) => `<label class="check"><input type="checkbox" value="${k}" ${(q.features || "").split(",").includes(k) ? "checked" : ""}>${v}</label>`).join(""));
  if (q.min) $("#f-min").value = q.min; if (q.max) $("#f-max").value = q.max; if (q.rating) $("#f-rating").value = q.rating; if (q.sort) $("#sort").value = q.sort;

  const state = { category: q.category || "" };
  const renderChips = () => {
    $("#cat-chips").innerHTML = [`<button class="chip" type="button" data-cat="" aria-pressed="${!state.category}">All</button>`].concat(window.PIRENTS_CATEGORIES.map(c => `<button class="chip" type="button" data-cat="${c.id}" aria-pressed="${state.category === c.id}">${P.icon(c.icon)} ${c.short}</button>`)).join("");
  };
  renderChips();
  $("#cat-chips").addEventListener("click", (e) => { const b = e.target.closest("[data-cat]"); if (!b) return; state.category = b.dataset.cat; $("#s-cat").value = state.category; renderChips(); apply(); });
  $("#s-cat").addEventListener("change", () => { state.category = $("#s-cat").value; renderChips(); });

  const selectedFeatures = () => [...document.querySelectorAll("#f-features input:checked")].map(i => i.value);
  const apply = () => {
    const where = $("#s-where").value.trim().toLowerCase(), from = $("#s-from").value, to = $("#s-to").value;
    const min = +$("#f-min").value || 0, max = +$("#f-max").value || Infinity, rating = $("#f-rating").value, feats = selectedFeatures(), sort = $("#sort").value;
    const days = P.days(from, to);
    let list = P.store.listings().filter(l =>
      (!state.category || l.category === state.category) &&
      (!where || l.city.toLowerCase().includes(where) || l.country.toLowerCase().includes(where) || (l.area || "").toLowerCase().includes(where)) &&
      l.price >= min && l.price <= max &&
      feats.every(f => (l.features || []).includes(f)) &&
      (rating === "new" ? !l.reviews : (l.rating || 0) >= +rating || (!l.reviews && +rating === 0)) &&
      (!days || days >= (l.minDays || 1))
    );
    if (sort === "price-asc") list.sort((a, b) => a.price - b.price);
    else if (sort === "price-desc") list.sort((a, b) => b.price - a.price);
    else if (sort === "rating") list.sort((a, b) => b.rating - a.rating || b.reviews - a.reviews);
    else list.sort((a, b) => (b.rating * Math.log(b.reviews + 2) + (b.mine ? 100 : 0)) - (a.rating * Math.log(a.reviews + 2) + (a.mine ? 100 : 0)));
    const cat = state.category ? P.category(state.category).name : "All listings";
    $("#results-title").textContent = where ? `${cat} in ${$("#s-where").value.trim()}` : cat;
    const cityName = $("#s-where").value.trim();
    const filtered = !!(feats.length || min || max < Infinity || rating !== "0");
    P.seo({
      title: (cityName ? `${cat} to rent in ${cityName}` : `${cat === "All listings" ? "Mobility gear" : cat} to rent`) + " from local owners | Pirents",
      description: cityName ? `Rent ${cat === "All listings" ? "wheelchairs, mobility scooters, bikes and accessible cars" : cat.toLowerCase()} in ${cityName} from verified local owners. ${list.length} listing${list.length === 1 ? "" : "s"} with clear daily prices, delivery to your accommodation and airport handover.` : `Search ${cat === "All listings" ? "wheelchairs, mobility scooters, e-bikes, accessible cars, strollers and rollators" : cat.toLowerCase()} to rent from local owners across Europe. Filter by city, dates, weight and delivery.`,
      canonical: (!filtered && !days && P.staticPath(cityName, state.category)) || (!cityName && state.category && !filtered && !days ? "gear/" + P.categorySlug(state.category) + "/" : null) || ("browse.html" + ((cityName || state.category) ? "?" + new URLSearchParams(Object.assign({}, cityName ? { where: cityName } : {}, state.category ? { category: state.category } : {})).toString() : "")),
      robots: (filtered || days) ? "noindex, follow" : "index, follow, max-image-preview:large",
      jsonld: { "@context": "https://schema.org", "@type": "ItemList", "name": cityName ? `${cat} in ${cityName}` : cat, "numberOfItems": list.length, "itemListElement": list.slice(0, 20).map((l, i) => ({ "@type": "ListItem", "position": i + 1, "url": "https://pirents.com/listing.html?id=" + l.id, "name": l.title })) }
    });
    $("#results-sub").textContent = `${list.length} result${list.length === 1 ? "" : "s"}` + (days ? ` · ${P.fmtDate(from)} to ${P.fmtDate(to)} (${days} day${days > 1 ? "s" : ""})` : "");
    $("#results").innerHTML = list.map(P.listingCard).join("");
    if (days) $("#results").querySelectorAll("a.stretch").forEach(a => a.href += `&from=${from}&to=${to}`);
    $("#empty").hidden = list.length > 0;
    if (!list.length) { const filtered = feats.length || min || max < Infinity || rating !== "0"; $("#empty").innerHTML = P.scout({ where: $("#s-where").value.trim(), category: state.category, from, to, filtered: !!filtered }); }
    else $("#empty").innerHTML = "";
    const params = new URLSearchParams(); if ($("#s-where").value) params.set("where", $("#s-where").value); if (from) params.set("from", from); if (to) params.set("to", to); if (state.category) params.set("category", state.category); if (feats.length) params.set("features", feats.join(",")); if ($("#f-min").value) params.set("min", $("#f-min").value); if ($("#f-max").value) params.set("max", $("#f-max").value); if (rating !== "0") params.set("rating", rating); if (sort !== "rec") params.set("sort", sort);
    history.replaceState(null, "", "browse.html" + (params.toString() ? "?" + params : ""));
  };
  $("#search").addEventListener("submit", (e) => { e.preventDefault(); apply(); });
  ["#f-min", "#f-max", "#f-rating", "#sort", "#f-features"].forEach(s => $(s).addEventListener("change", apply));
  const reset = () => { document.querySelectorAll("#f-features input").forEach(i => i.checked = false); $("#f-min").value = ""; $("#f-max").value = ""; $("#f-rating").value = "0"; state.category = ""; $("#s-cat").value = ""; $("#s-where").value = ""; $("#s-from").value = ""; $("#s-to").value = ""; renderChips(); apply(); };
  $("#f-reset").addEventListener("click", reset);
  $("#empty").addEventListener("click", (e) => { if (e.target.closest("[data-scout-reset]")) { document.querySelectorAll("#f-features input").forEach(i => i.checked = false); $("#f-min").value = ""; $("#f-max").value = ""; $("#f-rating").value = "0"; apply(); } });
  const mq = matchMedia("(max-width: 899px)");
  const syncMobile = () => { $("#filters-mobile-head").style.display = mq.matches ? "flex" : "none"; $("#filters-apply").style.display = mq.matches ? "inline-flex" : "none"; };
  mq.addEventListener("change", syncMobile); syncMobile();
  $("#filters-open").addEventListener("click", () => { $("#filters").dataset.open = "true"; $("#filters-close").focus(); });
  ["#filters-close", "#filters-apply"].forEach(s => $(s).addEventListener("click", () => { $("#filters").dataset.open = "false"; $("#filters-open").focus(); }));
  apply();
})();
</script>
</body>
</html>
